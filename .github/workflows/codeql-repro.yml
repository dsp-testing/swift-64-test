name: "CodeQL Swift 6.4 Silent Zero Repro"

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: macos-latest # Pulls macOS 27

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Select Xcode 27 (Swift 6.4)
      run: sudo xcode-select -s /Applications/Xcode_27.app/Contents/Developer

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: swift

    - name: Build Swift project
      run: swift build

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:swift"
